<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Business Canvas CRM</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>


<body>

  <div class="crm-app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

      <div class="sidebar-brand">

        <div class="brand-symbol">
          BC
        </div>

        <div class="brand-copy">

          <div class="brand-name">
            Business Canvas
          </div>

          <div class="brand-product">
            CRM
          </div>

        </div>

      </div>


      <nav class="sidebar-nav">

        <button
          type="button"
          class="nav-item active"
        >
          <span class="nav-icon">
            ◫
          </span>

          <span>
            Leads
          </span>
        </button>


        <button
          type="button"
          class="nav-item disabled"
          disabled
        >
          <span class="nav-icon">
            ◧
          </span>

          <span>
            Pipeline
          </span>
        </button>


        <button
          type="button"
          class="nav-item disabled"
          disabled
        >
          <span class="nav-icon">
            ✓
          </span>

          <span>
            Tasks
          </span>
        </button>


        <button
          type="button"
          class="nav-item disabled"
          disabled
        >
          <span class="nav-icon">
            ◷
          </span>

          <span>
            Activities
          </span>
        </button>

      </nav>


      <div class="sidebar-footer">

        <div class="sidebar-footer-label">
          Business Canvas
        </div>

        <div class="sidebar-footer-copy">
          Internal CRM
        </div>

      </div>

    </aside>



    <!-- =====================================================
         MAIN AREA
    ====================================================== -->

    <main class="main-content">


      <!-- ===================================================
           HEADER
      ==================================================== -->

      <header class="page-header">

        <div>

          <div class="page-eyebrow">
            CRM
          </div>

          <h1>
            Leads
          </h1>

          <p>
            Research-qualified companies and active opportunities.
          </p>

        </div>


        <div class="page-header-actions">

          <button
            type="button"
            id="refreshButton"
            class="secondary-button"
          >
            Refresh
          </button>

        </div>

      </header>



      <!-- ===================================================
           FILTERS
      ==================================================== -->

      <section class="filter-bar">

        <div class="filter-search">

          <input
            type="search"
            id="searchInput"
            placeholder="Search company, founder, lead ID..."
            autocomplete="off"
          >

        </div>


        <div class="filter-group">

          <select id="stageFilter">

            <option value="">
              All pipeline stages
            </option>

          </select>


          <select id="icpFilter">

            <option value="">
              All ICP levels
            </option>

            <option value="HIGH">
              High ICP
            </option>

            <option value="MEDIUM">
              Medium ICP
            </option>

            <option value="LOW">
              Low ICP
            </option>

          </select>

        </div>

      </section>



      <!-- ===================================================
           STATUS MESSAGE
      ==================================================== -->

      <section
        id="statusPanel"
        class="status-panel"
        hidden
      >
      </section>



      <!-- ===================================================
           CRM WORKSPACE
      ==================================================== -->

      <section class="crm-workspace">


        <!-- =================================================
             LEADS TABLE
        ================================================== -->

        <div class="lead-list-panel">

          <div class="panel-header">

            <div>

              <h2>
                Lead database
              </h2>

              <p id="leadCount">
                0 leads
              </p>

            </div>

          </div>


          <div class="table-container">

            <table class="lead-table">

              <thead>

                <tr>

                  <th>
                    Company
                  </th>

                  <th>
                    Founder
                  </th>

                  <th>
                    ICP
                  </th>

                  <th>
                    Stage
                  </th>

                  <th>
                    Next action
                  </th>

                  <th>
                    Responsible
                  </th>

                </tr>

              </thead>


              <tbody id="leadTableBody">

                <!--
                  app.js inserts lead rows here.
                -->

              </tbody>

            </table>

          </div>

        </div>



        <!-- =================================================
             LEAD DETAILS
        ================================================== -->

        <aside
          id="leadDetail"
          class="detail-panel empty"
        >

          <div class="detail-empty-state">

            <div class="detail-empty-icon">
              ◫
            </div>

            <h2>
              Select a lead
            </h2>

            <p>
              Click a company in the lead database to view its complete CRM record.
            </p>

          </div>

        </aside>


      </section>

    </main>

  </div>



  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script src="js/config.js"></script>

  <script src="js/api.js"></script>

  <script src="js/app.js"></script>

</body>

</html>
