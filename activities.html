<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Canvas CRM — Activities</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/activities.css">
</head>
<body>
  <div class="crm-app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-symbol brand-logo"><img src="assets/business-canvas-logo.png" alt="Business Canvas"></div>
        <div class="brand-copy"><div class="brand-name">Business Canvas</div><div class="brand-product">CRM</div></div>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">◫</span><span>Leads</span></a>
        <a href="pipeline.html" class="nav-item"><span class="nav-icon">◧</span><span>Pipeline</span></a>
        <a href="lead.html" class="nav-item"><span class="nav-icon">▣</span><span>Lead Profile</span></a>
        <a href="tasks.html" class="nav-item"><span class="nav-icon">✓</span><span>Tasks</span></a>
        <a href="activities.html" class="nav-item active"><span class="nav-icon">◷</span><span>Activities</span></a>
      </nav>

      <div class="sidebar-footer"><div class="sidebar-footer-label">Business Canvas</div><div class="sidebar-footer-copy">Internal CRM</div></div>
    </aside>

    <main class="main-content activities-main">
      <header class="page-header">
        <div><h1>Activities</h1></div>
        <div class="page-header-actions"><button type="button" id="activitiesRefreshButton" class="secondary-button">Refresh</button></div>
      </header>

      <section class="activities-summary" aria-label="Activity summary">
        <article class="activity-stat"><span class="activity-stat-label">Activities</span><strong id="activityTotal">0</strong></article>
        <article class="activity-stat"><span class="activity-stat-label">Outbound</span><strong id="activityOutbound">0</strong></article>
        <article class="activity-stat"><span class="activity-stat-label">Inbound</span><strong id="activityInbound">0</strong></article>
        <article class="activity-stat"><span class="activity-stat-label">Active leads</span><strong id="activityLeadCount">0</strong></article>
      </section>

      <section class="filter-bar activities-filter-bar">
        <div class="filter-search"><input type="search" id="activitySearchInput" placeholder="Search lead, contact, content, user..." autocomplete="off"></div>
        <div class="filter-group activities-filter-group">
          <select id="activityWeekFilter"><option value="all">All time</option></select>
          <select id="activityStageFilter"><option value="">All pipeline stages</option></select>
          <select id="activityUserFilter"><option value="">All users</option></select>
          <select id="activityTypeFilter"><option value="">All activity types</option></select>
          <select id="activityDirectionFilter"><option value="">All directions</option></select>
          <select id="activityChannelFilter"><option value="">All channels</option></select>
        </div>
      </section>

      <section id="activitiesStatusPanel" class="status-panel" hidden></section>

      <section class="activities-workspace">
        <div class="panel-header activities-panel-header">
          <div><h2>Activity log</h2><p id="activityCount">0 activities</p></div>
          <div class="activities-range-label" id="activityRangeLabel">All time</div>
        </div>

        <div class="table-container activities-table-container">
          <table class="lead-table activities-table">
            <thead><tr><th>Date</th><th>Lead</th><th>Contact</th><th>Type</th><th>Direction</th><th>Channel</th><th>Activity</th><th>Created by</th></tr></thead>
            <tbody id="activitiesTableBody"></tbody>
          </table>
          <div id="activitiesEmptyState" class="activities-empty" hidden>No activities match the selected filters.</div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/activities.js"></script>
</body>
</html>
